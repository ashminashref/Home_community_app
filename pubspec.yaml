name: mahal
description: "A production-quality Flutter app for a Muslim masjid / mahal community in Kerala, India."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  adhan: ^2.0.0+1
  just_audio: ^0.9.43
  pdf: ^3.11.3
  printing: ^5.13.4
  shared_preferences: ^2.5.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
